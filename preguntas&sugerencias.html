<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <h1>Formulario de contacto</h1>
    </header>
    <main>
        <form action="#" method="post">
            <label for="nombre">Nombre:</label>
            <input type="text" name="nombre" id="nombre" size="35" required><br><br>
            <label for="email">Correo:</label>
            <input type="email" name="email" id="email" size="25" required><br><br>
            <label for="tipo">Tipo de consulta:</label><br>
            <select name="tipo" id="tipo">
                <option value="pregunta">Pregunta</option>
                <option value="sugerencia">Sugerencia</option>
                <option value="otro">Otro</option>
            </select><br><br>
            <label for="mensaje">Mensaje:</label><br>
            <textarea name="mensaje" id="mensaje" rows="5" required></textarea><br><br>
            <button type="submit">Enviar</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Juan Chicharro</p>
    </footer>

</body>

</html>
